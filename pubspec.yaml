name: tower_building
description: "Tower Building - stack blocks and build the tallest tower!"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Game engine
  flame: ^1.37.0
  flame_forge2d: ^0.19.2+6
  # Gray flow — attribution & analytics
  appsflyer_sdk: ^6.15.3
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.4
  firebase_app_check: ^0.3.2+10
  # Gray flow — networking & storage
  http: ^1.3.0
  connectivity_plus: ^6.1.4
  flutter_secure_storage: ^10.0.0
  device_info_plus: ^11.3.3
  # Gray flow — WebView
  webview_flutter: ^4.13.1
  webview_flutter_android: ^4.11.0
  file_picker: ^11.0.2
  # Gray flow — push notifications
  flutter_local_notifications: ^18.0.1
  # Shared
  video_player: ^2.11.1
  shared_preferences: ^2.5.5
  google_fonts: ^8.1.0
  audioplayers: ^6.6.0
  url_launcher: ^6.3.1
  package_info_plus: ^8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.webp
    - assets/logo_name.webp
    - assets/gameplay_assets/
    - assets/additional_assets/loading_screen/
    - assets/additional_assets/no_wifi/
    - assets/additional_assets/notifications/
    - assets/music/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.webp"
  remove_alpha_ios: true
  background_color_ios: "#87CEEB"
  adaptive_icon_background: "#87CEEB"
  adaptive_icon_foreground: "assets/logo.webp"
