name: tower_building
description: "Tower Building — hand-built construction puzzles."
publish_to: 'none'
version: 1.0.4+6

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9

  # ── Platform plugins (no game-engine frameworks) ──────────────
  # The gameplay runs on a hand-written ticker + widget renderer, so there is
  # no Flame / Forge2D / box2d dependency to fingerprint the build.
  video_player: ^2.10.0
  shared_preferences: ^2.4.10
  audioplayers: ^6.5.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.9.0
  webview_flutter_wkwebview: ^3.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  image: ^4.5.4

flutter:
  uses-material-design: true

  config:
    enable-swift-package-manager: false

  assets:
    - assets/logo.webp
    - assets/logo_name.webp
    - assets/art/
    - assets/gameplay_assets/
    - assets/additional_assets/loading_screen/
    - assets/music/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.webp"
  remove_alpha_ios: true
  background_color_ios: "#87CEEB"
  adaptive_icon_background: "#87CEEB"
  adaptive_icon_foreground: "assets/logo.webp"
