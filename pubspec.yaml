name: tower_building
description: "Tower Building - stack blocks and build the tallest tower!"
publish_to: 'none'
version: 1.0.2+4

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  video_player: ^2.11.1
  shared_preferences: ^2.5.5
  audioplayers: ^6.6.0
  url_launcher: ^6.3.1

  # ── Gray gate layer ───────────────────────────────────────
  appsflyer_sdk: ^6.16.3
  app_tracking_transparency: ^2.0.6
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.8
  firebase_app_check: ^0.3.2+10
  flutter_local_notifications: ^18.0.1
  webview_flutter: ^4.13.1
  webview_flutter_android: ^4.11.0
  webview_flutter_wkwebview: ^3.22.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.8.0

flutter:
  uses-material-design: true

  # Disable Swift Package Manager — Firebase managed via CocoaPods to
  # prevent module redefinition conflicts when the NSE target also pulls
  # in Firebase/Messaging via Pods.
  config:
    enable-swift-package-manager: false

  assets:
    - assets/logo.webp
    - assets/logo_name.webp
    - assets/gameplay_assets/
    - assets/additional_assets/loading_screen/
    - assets/additional_assets/no_wifi/
    - assets/additional_assets/notifications/
    - assets/music/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.webp"
  remove_alpha_ios: true
  background_color_ios: "#87CEEB"
  adaptive_icon_background: "#87CEEB"
  adaptive_icon_foreground: "assets/logo.webp"
